# ==============================================================================
# 我的 mpv 配置
# 平台：Windows / mpv（以 v0.41 校对）
# 位置：便携版放 portable_config/mpv.conf；安装版放 %APPDATA%\mpv\mpv.conf
# 原则：与默认值相同的项一律不写，所以文件很短；标「可选」的按需取消注释
# ==============================================================================

# ------------------------------- 视频输出 --------------------------------------
vo=gpu-next                              # 新一代渲染后端（画质与色彩管理更好）
gpu-api=d3d11                            # Windows 下用 D3D11
hwdec=d3d11va                            # 硬件解码

# ------------------------------- 色彩与 HDR ------------------------------------
target-colorspace-hint=yes               # 把色彩空间元数据交给系统，HDR 直通（默认 auto）
dither-depth=10                          # 抖动位深需与显示器一致，8bit 屏请改 auto 或 8

# ------------------------------- 缩放与插值 ------------------------------------
scale=ewa_lanczossharp                   # 放大算法
cscale=ewa_lanczos                       # 色度放大算法
interpolation=yes                        # 补帧到显示器刷新率
video-sync=display-resample              # 以音频为基准微调画面节奏（配合上面的补帧）
# video-sync=audio                       # 备选：回到音频为主（默认值），个别片源/设备反而更稳时用

# ------------------------------- 字幕与音轨 ------------------------------------
slang=chs,cht,chi,eng                    # 字幕语言优先级
sub=auto                                 # 自动选择字幕轨
sub-auto=fuzzy                           # 自动加载近似名的外置字幕
stretch-image-subs-to-screen=yes         # 图形字幕拉伸到画面宽度
audio-file-auto=fuzzy                    # 自动加载近似名的外置音轨

# ------------------------------- 窗口与 OSD ------------------------------------
ontop=yes                                # 总是置顶
title="${filename} - mpv"                # 窗口标题
osd-bar=no                               # 关掉内建进度条（uosc 自绘）
input-default-bindings=no                # 屏蔽内建快捷键，改用自备的 input.conf
# border=no                              # 可选：无边框，窗控由 uosc 自绘
# window-maximized=yes                   # 可选：启动即最大化

# ------------------------------- 播放行为 --------------------------------------
keep-open=yes                            # 播完停在最后一帧，不自动退出
# save-position-on-quit=yes              # 可选：退出时记住进度，下次续播
# watch-later-options=start,vid,aid,sid  # 可选：只记进度与所选轨道（配合上一行）

# ------------------------------- 截图 ------------------------------------------
screenshot-directory="~~desktop/"        # 截图存到桌面


# ==============================================================================
# 可选方案：按需取消注释
# ==============================================================================

# --- 换用 Vulkan 后端（部分显卡 HDR/性能更好，兼容性略差）---
# gpu-api=vulkan
# hwdec=vulkan
# vulkan-async-transfer=yes
# inverse-tone-mapping=yes

# --- 蓝光原盘无法进入菜单时，回退到 D3D11 上下文 ---
# 本配置主流程已是 d3d11，这段只在上面改用 Vulkan 后才有意义
