# =====================================================================================
# forsure.live — 站点配置（Hugo + FixIt v1）
#
# 这里只写「与主题默认值不同」的项，其余全部继承 themes/FixIt/hugo.toml。
# Hugo 默认会深度合并主题的 params，所以下面的 params 是增量覆盖，不会丢主题默认值。
#
# ⚠️ 主题已钉在 v1.0.0-beta.1，请勿运行 `git submodule update --remote`
#    （要升级请显式 checkout 新 tag，见 README/计划文档）
#
# 主题配置参考：themes/FixIt/hugo.toml（含全部键名与注释）
# 文档：https://fixit.lruihao.cn/zh-cn/
# =====================================================================================

# --- 站点基本 -------------------------------------------------------------------
baseURL = "https://forsure.live/"
title = "ForSure's Blog"
theme = ["FixIt"]

# --- 语言 / 时区（FixIt v1 用 locale，languageCode 已废弃）----------------------
defaultContentLanguage = "zh-cn"
locale = "zh-CN"
label = "简体中文"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"

# --- 基础开关 -------------------------------------------------------------------
enableRobotsTXT = true
enableGitInfo = true          # .Lastmod 取自 git 提交（CI 需 fetch-depth: 0）
enableEmoji = true
mainSections = ["posts"]
copyright = "ForSure's Blog"
summaryLength = 70           # 首页/列表摘要长度，对应旧站 auto_excerpt

# --- 保留旧 URL -----------------------------------------------------------------
# 旧站 Hexo 是 `permalink: :translate_title/`，文章在根路径 /<slug>/
# 这里对齐成同样形状，这样 /customize-some-effects-for-hexofluid/ 不变，
# Twikoo 评论（按页面路径存）才会自动挂回来。
[permalinks.page]
posts = "/:slug/"

# =====================================================================================
[params]

description = "ForSure 的个人博客"
keywords = ["ForSure", "博客", "AMD"]
default_theme = "dark"       # 旧站 dark_mode.default: dark
summary_plainify = true
date_format = "2006-01-02"

# 资源文件名指纹（sha256）：CSS/JS 内容一变，文件名就带新 hash —— 于是
# Cloudflare / 浏览器不可能再拿旧副本糊弄访客，也顺手获得 SRI 完整性校验。
# 起因：Cloudflare 把 /css/*.css 缓存 4 小时（Cache-Control: max-age=14400），
# 不带 hash 的文件名会让样式改动最长 4 小时不生效。HTML 本身是 DYNAMIC 不缓存的，
# 所以只要文件名会变，指向就总是最新。
# 注意：static/ 下的文件（snow.js、图片）不走 Hugo 资源管线，因此不带 hash；
# 改动它们仍需 purge 缓存或等过期。
fingerprint = "sha256"

# --- 作者 -----------------------------------------------------------------------
[params.author]
name = "ForSure"
link = "https://forsure.live/"
avatar = "/images/avatar.jpg"

# --- 顶栏 -----------------------------------------------------------------------
[params.header]
desktop_mode = "sticky"
blur = true

[params.header.title]
name = "ForSure's Blog"

[params.header.subtitle]
# 置空：旧站的 "AMD,YES!" 显示在首页 banner 上，FixIt 会渲染到顶栏，故留空。
# 首页那句随机一言见 [params.home.profile] subtitle + assets/js/custom.js。
name = ""
typeit = false

# --- 首页 -----------------------------------------------------------------------
[params.home.profile]
enable = true
avatar_url = "/images/avatar.jpg"
title = "ForSure"
subtitle = "偷偷地Welcome一下!"   # 会被 hitokoto 随机一言替换；取不到就显示这句
typeit = false
social = true
only_first_page = true     # Hero 只在首页第一页出现，翻页不重复

[params.home.posts]
enable = true
paginate = 10                # 旧站 per_page: 10
image_preview = true

# --- 外观 / 配色 ----------------------------------------------------------------
# 主题的 [params.appearance] 是真·默认值所在（主题 hugo.toml 里那个是空脚手架）。
# 两个硬性约束：值必须是 hex（写 red 这类命名色会被静默丢弃）；
# 每个 *_dark 都有对应的浅色同胞键，只设 *_dark 就等于"浅色模式不动"。
[params.appearance]
# 深色页面底色压到 #181c27（默认 #1f252d 偏浅偏平）
global_background_color_dark = "#181c27"
# 顶栏比页面再暗一档，吸顶时才读得出"这是一条栏"
header_background_color_dark = "#121821"
# 代码块标题栏必须抬起来：默认 #161f28=(22,31,40) 与新底色 #181c27=(24,28,39) 几乎同色，
# 会和页面糊在一起（mac 面板尤其明显）
code_header_background_color_dark = "#212a35"
# 圆角 6px -> 10px：封面/代码/表格/图片统一柔和（custom.scss 里用的就是这个变量）
global_border_radius = "10px"

# --- 代码块 ---------------------------------------------------------------------
# mac 模式 = FixIt 内置的 macOS 风格面板，替代旧站自定义的 macpanel.css
[params.codeblock]
mode = "mac"
copyable = true
wrapper = true
shadow = "hover"             # 暗色底上给 mac 面板一点浮起感（悬停触发）

# --- 目录 -----------------------------------------------------------------------
[params.toc]
enable = true
position = "end"
start_level = 2
end_level = 6

# --- 搜索（本地 Fuse.js，无需 Algolia）------------------------------------------
[params.search]
enable = true
type = "fuse"
placeholder = "搜索"

[params.search.fuse]
min_match_char_length = 1    # 主题默认 2，中文单字查询会查不到，放宽到 1

# --- 浏览数 / 统计 --------------------------------------------------------------
# 旧站的 LeanCloud 浏览量已移除（LeanCloud 2027-01-12 关停公共服务）。
# 访问统计改用 GoatCounter，等上线阶段再接入（阶段 5）。

# --- 评论：Twikoo（沿用现有后端）------------------------------------------------
[params.comment]
enable = true

[params.comment.twikoo]
enable = true
env_id = "https://twikoo.forsure.live"
region = "ap-shanghai"
path = ""                    # 留空 = 用 window.location.pathname，旧评论按路径自动接回
visitor = true
comment_count = true

# --- Cookie 同意横幅 ------------------------------------------------------------
# 主题默认开启（[params.cookieconsent] enable = true），但旧站没有这个横幅，
# 且本站只用 GoatCounter（本身无 Cookie）与 Twikoo，所以关掉。
# 若以后要开，改回 true 即可。
[params.cookieconsent]
enable = false

# --- 访问统计：GoatCounter ------------------------------------------------------
# FixIt v1 没有内建 GoatCounter provider（只有 google/fathom/baidu/umami/plausible/cloudflare），
# 所以用 [params.custom_partials] head 钩子自己注入：layouts/_partials/goatcounter.html
# 站点码 = 注册时选的子域名前缀，也就是 https://<这段>.goatcounter.com 里的那段，
# 在 GoatCounter 后台能看到。留空则不注入（等于关闭统计）。
[params.goatcounter]
code = "forsure"   # <- https://forsure.goatcounter.com/count 里的那段

# 把上面的 partial 挂到 <head>
[params.custom_partials]
head = ["goatcounter"]

# --- 页脚 -----------------------------------------------------------------------
[params.footer]
enable = true
copyright = true
author = true
since = "2020"

[params.footer.site_time]
enable = true
animate = true
icon = "fa-solid fa-heart"   # 旧站页脚的那颗心（hover 变红见 custom.scss）
value = "2020-11-18T00:00:00+08:00"

# --- 社交链接 -------------------------------------------------------------------
# 主题按 assets/data/social.yml 里的 Prefix 拼 URL
[params.social]
GitHub = "chenfangshuo"       # -> https://github.com/chenfangshuo
Bilibili = "17124794"         # -> https://space.bilibili.com/17124794
Douban = "195143404"          # -> https://www.douban.com/people/195143404/
Steam = ""                    # 见下方自定义项（数字 SteamID 不能走 /id/ 前缀）

# 旧链接是 https://steamcommunity.com/profiles/76561198319588402（数字 SteamID），
# 而主题内置的 steam 前缀是 https://steamcommunity.com/id/（只适用于自定义短名），
# 所以这里另起一个自定义条目，用 /profiles/ 前缀。
[params.social.steamprofile]
id = "76561198319588402"
weight = 39
prefix = "https://steamcommunity.com/profiles/"
title = "Steam"

[params.social.steamprofile.icon]
class = "fa-brands fa-steam"

# --- 菜单 -----------------------------------------------------------------------
# 旧站只有「关于 / 友链」两个无文字图标项；归档等页面生成了却没有入口，这里一并补上。
# 搜索按钮与明暗切换由主题自动加到顶栏，无需在此声明。
[[menus.main]]
identifier = "about"
name = "关于"
url = "about/"
weight = 1

[menus.main.params]
icon = "fa-solid fa-user"

[[menus.main]]
identifier = "links"
name = "友链"
url = "links/"
weight = 2

[menus.main.params]
icon = "fa-solid fa-link"

# =====================================================================================
# 以下为「结构性配置」，从 themes/FixIt/hugo.toml @ v1.0.0-beta.1 原样复制而来。
#
# 为什么必须复制进来：Hugo 从「主题自己的配置文件」只默认合并 params / menus /
# outputFormats / mediaTypes 四项，markup、outputs、taxonomies、frontmatter、sitemap、
# privacy、build 都**不会**自动继承。其中最关键的是
# [markup.goldmark.renderer] unsafe = true —— 少了它，那篇迁移过来的文章里的
# <div id="refer-anchor-*> 锚点和 <sup> 脚注会被 Goldmark 直接丢掉。
#
# 另外 [outputs] 里的 archives / search 也是 FixIt 归档页与本地搜索索引所必需的。
#
# 因为已完整复制，这里去掉了主题原本的 _merge 标记（不再依赖合并语义）。
# 升级主题时若主题的结构性配置有变，需要同步更新本节。
# =====================================================================================
[frontmatter]
lastmod = [
  "lastmod",
  ":git",
  ":fileModTime",
  ":default",
]

# -------------------------------------------------------------------------------------
# Menu Configuration
# See: https://fixit.lruihao.cn/docs/getting-started/configuration/#menu-configuration
# -------------------------------------------------------------------------------------


[related]
includeNewer = false
threshold = 80
toLower = false

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'keywords'
pattern = ''
toLower = false
type = 'basic'
weight = 100

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'date'
pattern = ''
toLower = false
type = 'basic'
weight = 10

[[related.indices]]
applyFilter = false
cardinalityThreshold = 0
name = 'tags'
pattern = ''
toLower = false
type = 'basic'
weight = 80

[[related.indices]]
applyFilter = false
name = 'fragmentrefs'
type = 'fragments'
weight = 80

# -------------------------------------------------------------------------------------
# Modules Configuration
# See: https://gohugo.io/configuration/module/
# -------------------------------------------------------------------------------------


[module]

[module.hugoVersion]
min = "0.166.0"

# -------------------------------------------------------------------------------------
# Markup Configuration
# See: https://gohugo.io/configuration/markup/
# -------------------------------------------------------------------------------------


[markup]

# Syntax highlighting.
# See: [Syntax Highlighting](https://gohugo.io/content-management/syntax-highlighting)
[markup.highlight]
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
# https://github.com/hugo-fixit/FixIt/issues/43
codeFences = true
noClasses = false
# ~~~~~~~~~~ necessary configurations ~~~~~~~~~~
anchorLineNos = false
guessSyntax = true
lineNos = true
lineNumbersInTable = true

# Goldmark is from Hugo 0.60 the default library used for Markdown.
# See: [Goldmark](https://gohugo.io/configuration/markup/#goldmark)
[markup.goldmark]
duplicateResourceFiles = false

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = 'https'
strikethrough = false
table = true
taskList = true
typographer = true

# See: https://gohugo.io/configuration/markup/#extras
[markup.goldmark.extensions.extras]

[markup.goldmark.extensions.extras.delete]
enable = true

[markup.goldmark.extensions.extras.insert]
enable = true

[markup.goldmark.extensions.extras.mark]
enable = true

[markup.goldmark.extensions.extras.subscript]
enable = true

[markup.goldmark.extensions.extras.superscript]
enable = true

# See: [Mathematics](https://gohugo.io/content-management/mathematics/)
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [
  [
    '\[',
    '\]'
  ],
  [
    '$$',
    '$$'
  ]
]
inline = [
  [
    '\(',
    '\)'
  ],
  [
    '$',
    '$'
  ]
]

[markup.goldmark.parser]

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
hardWraps = false
# Whether to use HTML tags directly in the document.
unsafe = true
xhtml = false

# -------------------------------------------------------------------------------------
# Sitemap Configuration
# See: https://gohugo.io/configuration/sitemap/
# -------------------------------------------------------------------------------------


[sitemap]
changefreq = "weekly"
disable = false
filename = "sitemap.xml"
priority = 0.5

# -------------------------------------------------------------------------------------
# Permalinks Configuration
# See: https://gohugo.io/configuration/permalinks/
# -------------------------------------------------------------------------------------


[privacy]

[privacy.x]
enableDNT = true

[privacy.youtube]
privacyEnhanced = true

# -------------------------------------------------------------------------------------
# Media Types Configuration
# See: https://gohugo.io/configuration/media-types/
# -------------------------------------------------------------------------------------

# [mediaTypes]

# [mediaTypes."application/feed+json"]
# suffixes = [ "json" ]

# -------------------------------------------------------------------------------------
# Output Format Configuration
# See: https://gohugo.io/configuration/output-formats/
# -------------------------------------------------------------------------------------


[outputs]
home = [
  "html",
  "rss",
  "archives",
  "search",
  "offline",
  "manifest",
  "link"
]
page = [
  "html",
  "markdown"
]
section = [
  "html",
  "rss"
]
taxonomy = [ "html" ]
term = [
  "html",
  "rss"
]

# -------------------------------------------------------------------------------------
# Taxonomies Configuration
# See: https://gohugo.io/configuration/taxonomies/
# -------------------------------------------------------------------------------------


[taxonomies]
category = "categories"
tag = "tags"
collection = "collections"
# Enables /authors/<name>/ archive pages for the page-level `authors` front matter field.
# Optional — sites that never set `authors` are unaffected.
author = "authors"

# -------------------------------------------------------------------------------------
# Build Configuration
# See: https://gohugo.io/configuration/build/
# -------------------------------------------------------------------------------------


[build]
noJSConfigInAssets = true

# -------------------------------------------------------------------------------------
# Theme Core Configuration
# Two types of params:
#   1. Site-level params — apply to the entire site, can NOT be overridden per-page.
#   2. Page-level params — can be overridden per-page via page front matter.
#
# See: https://fixit.lruihao.cn/docs/getting-started/configuration/params/
# -------------------------------------------------------------------------------------


