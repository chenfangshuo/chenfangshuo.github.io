# =============================================================================
# 构建并发布 forsure.live
#
# 设计要点（与「配好就长期不动」这个目标一致）：
#   - Hugo 与 Dart Sass 版本都写死在 env 里，与本地一致 → 产物可复现
#   - 只安装 Hugo extended + Dart Sass，**不需要 Node、不需要 Go**
#     （fixit-cli 与内容加密组件才需要 Node，本站没用；Hugo Modules 才需要 Go，本站用 submodule）
#   - 主题以 submodule 方式锁定（submodules: recursive 会取到钉死的那个 commit）
#   - **刻意不使用 actions/configure-pages**：本仓库的 Pages 已经配好自定义域名，
#     configure-pages 有可能去写 Pages 的域名配置，风险不值得冒；
#     upload-pages-artifact + deploy-pages 本身就够用
#   - **不加任何定时自动升级主题/依赖的 workflow**（见 README 的「不要做的事」）
# =============================================================================

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # 不要取消正在进行的生产部署

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.167.0
  DART_SASS_VERSION: 1.105.1
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive # 取到锁定的 themes/FixIt
          fetch-depth: 0 # enableGitInfo 需要完整历史，否则 .Lastmod 不准

      - name: Install Hugo (extended) and Dart Sass
        run: |
          set -euo pipefail
          # 直接用官方发布包，不引第三方 action（与主题 devcontainer 里的装法一致）
          curl -sSLfo hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xf hugo.tar.gz hugo
          curl -sSLfo dart-sass.tar.gz \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          sudo tar -C /usr/local -xf dart-sass.tar.gz
          sudo ln -sf /usr/local/dart-sass/sass /usr/local/bin/sass
          # 自检：版本不符就让这步直接失败，避免"悄悄用了别的版本"
          hugo version
          sass --version

      - name: Build
        run: hugo --gc --minify --logLevel info

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # 部署后清一次 Cloudflare 缓存。
  #
  # 起因：为了让国内访客不再每次翻页都跑一趟「CF 边缘（洛杉矶）→ 源站（东京 GitHub Pages）」，
  # 在 Cloudflare 加了一条 Cache Rule 让 HTML 也能边缘缓存（默认 HTML 是 DYNAMIC 不缓存的）。
  # 代价是内容更新后边缘可能还留着旧 HTML —— 所以每次部署必须 purge，两件事是一套的，缺一不可。
  #
  # ⚠️ 这里**故意不加 continue-on-error**：purge 失败 = 访客可能看到旧页面（最长 10 分钟，
  #    即 GitHub Pages 给 HTML 的 max-age=600），属于用户可见的问题，应该让 CI 红给你看。
  #    对比 notify-baidu —— 那个失败了没有任何用户可见后果，所以它才 continue-on-error。
  #
  # 没配 Secret 时优雅跳过（不会把 CI 弄红），方便先合并这份 workflow 再去建 token。
  purge-cloudflare:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "::notice::CF_API_TOKEN / CF_ZONE_ID 未配置，跳过 purge。"
            echo "若已启用 HTML 边缘缓存（Cache Rule），跳过 purge 会让内容更新最长延迟 10 分钟。"
            echo "配置方法见 MAINTENANCE.local.md「国内访问优化」。"
            exit 0
          fi
          # purge_everything 最简单也最不容易漏。代价是带指纹的 CSS/JS 也会被清掉、
          # 下次访问重新拉一遍 —— 本站很小，可忽略。想更精细可以换成
          # {"hosts":["forsure.live"]}，但那样要自己保证不漏。
          resp=$(curl -sS --max-time 30 -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Cloudflare purge 失败——边缘可能继续返回旧 HTML"; exit 1; }

  # 把新站的 URL 推给百度，保持收录（旧站靠 hexo-baidu-url-submit 做这件事）
  notify-baidu:
    needs: purge-cloudflare # 排在 purge 之后，保证百度抓到的是新内容
    runs-on: ubuntu-latest
    continue-on-error: true # 百度接口挂了也不能影响站点发布
    steps:
      - name: Submit sitemap URLs to Baidu
        run: |
          set -uo pipefail
          sleep 15 # 给 Pages 一点时间
          curl -sS --max-time 30 https://forsure.live/sitemap.xml \
            | grep -oE '<loc>[^<]+' | sed 's|<loc>||' > urls.txt || true
          echo "URLs to submit: $(wc -l < urls.txt)"
          head -5 urls.txt
          # token 存在仓库 Secret 里，不要写进仓库（旧站把它明文写在 _config.yml 里了）
          curl -sS --max-time 30 -H 'Content-Type:text/plain' --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=forsure.live&token=${{ secrets.BAIDU_TOKEN }}"
